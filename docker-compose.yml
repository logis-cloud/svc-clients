services:
  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: clientes_db
    ports:
      - "3307:3306"        # Exponer solo en desarrollo. En producción esta MV no es pública.
    volumes:
      - mysql_clientes_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-clientes:
    build: .
    container_name: ms-clientes
    restart: unless-stopped
    environment:
      DB_USER: root
      DB_PASSWORD: root123
      DB_HOST: mysql-clientes
      DB_PORT: "3306"
      DB_NAME: clientes_db
    ports:
      - "8001:8000"         # En producción, este puerto queda detrás del balanceador / API Gateway
    depends_on:
      mysql-clientes:
        condition: service_healthy

volumes:
  mysql_clientes_data:
